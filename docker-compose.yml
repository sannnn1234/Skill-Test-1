version: '3.8'

services:

  backend-dev:
    build: ./backend/dev
    ports:
      - "3001:3001"
    env_file:
      - ./backend/dev/.env
    networks:
      - multienv_network

  backend-prod:
    build: ./backend/prod
    ports:
      - "3002:3002"
    env_file:
      - ./backend/prod/.env
    networks:
      - multienv_network

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend-dev
      - backend-prod
    networks:
      - multienv_network

networks:
  multienv_network:
    driver: bridge